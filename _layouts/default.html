{%- assign build_version = site.time | date: "%Y%m%d%H%M%S" -%}
<!doctype html>
<html lang="zh-CN" data-language="zh" data-build-version="{{ build_version }}">
  {% include head.html %}
  <body>
    <a class="skip-link" href="#main" data-i18n="skipLink">跳转到主要内容</a>
    <div class="site-shell">
      {% include header.html %}
      <main class="page-content" id="main">
        {{ content }}
      </main>
      {% include footer.html %}
    </div>
    <script src="{{ '/script.js' | relative_url }}?v={{ build_version }}"></script>
  </body>
</html>
