<div id="site-entrance" class="entrance" role="dialog" aria-modal="true" aria-labelledby="entrance-label" tabindex="-1" hidden>
  <span id="entrance-label" class="entrance__label">
    <span data-lang="zh">正在进入网站，可按 Enter 跳过动画。</span>
    <span data-lang="en">Entering the site. Press Enter to skip the animation.</span>
  </span>
  <div class="entrance__command" aria-hidden="true"><span data-entrance-command></span><span class="entrance__cursor"></span></div>
  <button class="entrance__skip" type="button" data-entrance-skip>
    <span class="lang-inline" data-lang="zh">跳过</span>
    <span class="lang-inline" data-lang="en">Skip</span>
    <span class="entrance__key" aria-hidden="true">[Enter]</span>
  </button>
</div>
