{%- assign build_version = site.time | date: "%Y%m%d%H%M%S" -%}
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="site-build-version" content="{{ build_version }}" />
  <meta
    name="description"
    content="{{ page.description | default: site.description | escape }}"
  />
  <title>
    {% if page.url == "/" %}{{ site.title }} | Projects & Notes{% else %}{{ page.title | default: site.title }} | {{ site.title }}{% endif %}
  </title>
  <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}?v={{ build_version }}" />
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}?v={{ build_version }}" />
</head>
