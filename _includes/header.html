<header class="site-header" id="top">
  <div class="site-topline">
    <a class="site-title" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
      {{ site.title }}
    </a>

    <div class="site-tools">
      <div class="quote-frame" data-quote-frame>
        <p class="header-quote" data-quote-rotator aria-live="polite">爱能穿越时间和空间</p>
      </div>
      <div class="language-switch" aria-label="Language switch">
        <button type="button" data-language="zh" aria-pressed="true">ZH</button>
        <span aria-hidden="true">/</span>
        <button type="button" data-language="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </div>

  <section class="music-player" aria-label="Dreamworld radio" data-music-player>
    <div class="music-player-main">
      <button
        class="music-toggle"
        type="button"
        data-music-toggle
        aria-label="Play music"
        aria-pressed="false"
        title="Play music"
      >
        <span class="music-toggle-icon" aria-hidden="true"></span>
      </button>

      <div class="music-track">
        <p class="music-label" data-i18n="musicLabel">Dreamworld Radio</p>
        <p class="music-title" data-i18n="musicTitle">Soft loop for drifting around</p>
      </div>
    </div>

    <div class="music-controls">
      <div class="music-progress-group">
        <span class="music-time" data-music-current>0:00</span>
        <input
          class="music-seek"
          type="range"
          min="0"
          max="48"
          value="0"
          step="0.1"
          data-music-seek
          aria-label="Seek music"
        />
        <span class="music-time" data-music-duration>0:48</span>
      </div>

      <label class="music-volume-control" title="Music volume">
        <span class="music-volume-icon" aria-hidden="true"></span>
        <input
          class="music-volume"
          type="range"
          min="0"
          max="1"
          value="0.58"
          step="0.01"
          data-music-volume
          aria-label="Music volume"
        />
      </label>
    </div>

    <audio
      class="music-audio"
      src="{{ '/assets/audio/dreamworld-loop.mp3' | relative_url }}"
      preload="none"
      loop
      data-music-audio
    ></audio>
  </section>

  <nav class="site-nav" aria-label="Primary navigation">
    <a href="{{ '/#about' | relative_url }}" data-section-link="about" data-i18n="navAbout">简介</a>
    <span aria-hidden="true">/</span>
    <a href="{{ '/#projects' | relative_url }}" data-section-link="projects" data-i18n="navProjects">项目</a>
    <span aria-hidden="true">/</span>
    <a href="{{ '/#notes' | relative_url }}" data-section-link="notes" data-i18n="navNotes">随笔</a>
    <span aria-hidden="true">/</span>
    <a href="{{ '/#contact' | relative_url }}" data-i18n="navContact">联系</a>
  </nav>
</header>
